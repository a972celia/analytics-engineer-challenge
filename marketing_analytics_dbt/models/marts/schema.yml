version: 2

models:
  - name: mart_marketing_performance
    description: "Unified marketing performance datamart combining Ad Network 1 and Ad Network 2 with the most detailed geo information available"
    columns:
      - name: date
        description: "Report date"
        tests:
          - not_null

      - name: ad_network
        description: "Source ad network (ad_network_1 or ad_network_2)"
        tests:
          - not_null
          - accepted_values:
              values: ['ad_network_1', 'ad_network_2']

      - name: campaign_id
        description: "Campaign identifier (unique within each ad network)"
        tests:
          - not_null

      - name: campaign_name
        description: "Campaign name"

      - name: country_code
        description: "ISO Alpha-2 country code"
        tests:
          - not_null

      - name: country_name
        description: "Full country name (only available for Ad Network 1)"

      - name: state_name
        description: "State/region name (when available)"

      - name: state_type
        description: "Type of sub-country location (State, Province, etc.)"

      - name: geo_granularity
        description: "Geographic granularity level of this record"
        tests:
          - accepted_values:
              values: ['country', 'state']

      - name: spend
        description: "Ad spend in USD"
        tests:
          - not_null

      - name: impressions
        description: "Number of ad impressions"
        tests:
          - not_null

      - name: clicks
        description: "Number of ad clicks"
        tests:
          - not_null

      - name: cpm
        description: "Cost per thousand impressions (calculated)"

      - name: cpc
        description: "Cost per click (calculated)"

      - name: ctr
        description: "Click-through rate as percentage (calculated)"
